name: Homelab playback fixes

on:
  push:
    branches: [homelab]
  pull_request:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/dispatcharr/dispatcharr@sha256:f81924fa3dbfeb463b3908be7e086bf58aacbd2ba56062bfb555ee3a471acf8f
      options: --entrypoint ""
    env:
      DISPATCHARR_ENV: aio
      DJANGO_SECRET_KEY: isolated-ci-test-key
      DISPATCHARR_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v6
      - name: Test VOD selection, seeks and connection accounting
        run: bash scripts/ci_bootstrap_backend.sh apps.proxy.vod_proxy.tests -v2

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build the exact deployable image
        run: docker build -f docker/Dockerfile.homelab -t dispatcharr-homelab:${{ github.sha }} .
